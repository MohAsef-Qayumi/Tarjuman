<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tarjuman</title>
    <style>
      body { width: 300px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #1c1917; background: #faf8f3; }
      h1 { margin: 0 0 4px; font-size: 16px; color: #14532d; }
      p { margin: 0 0 14px; color: #78716c; font-size: 13px; }
      label { display: block; margin-top: 12px; font-size: 12px; font-weight: 600; color: #57534e; }
      select, input[type="url"] { width: 100%; height: 32px; margin-top: 4px; padding: 0 8px; border: 1px solid #e7e2d8; border-radius: 6px; background: #fff; font-size: 13px; box-sizing: border-box; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-weight: 400; color: #1c1917; font-size: 13px; }
      .saved { margin-top: 12px; font-size: 12px; color: #14532d; min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>Tarjuman</h1>
    <p>Select text or click the floating ت button, then pick a paragraph.</p>
    <label for="to">Translate to</label>
    <select id="to"></select>
    <label class="row"><input id="everywhere" type="checkbox" /> Show the button on every site</label>
    <label for="apiBase">Server</label>
    <input id="apiBase" type="url" required />
    <div class="saved" id="saved" role="status"></div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
